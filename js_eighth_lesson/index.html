<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eighth lesson JS</title>
    <style>
        #tree span { cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Eighth lesson JS</h1>
    <p>Домашнє завдання: події.</p>

    <h2>Завдання 1</h2>
    <input type="button" id="hider" value="Сховати текст">
    <div id="text">Цей текст має зникнути після кліку.</div>

    <h2>Завдання 2</h2>
    <input type="button" id="self-hider" value="Натисни — і я зникну">

    <h2>Завдання 3</h2>
    <ul id="tree">
        <li><span>Тварини</span>
            <ul>
                <li><span>Ссавці</span>
                    <ul>
                        <li>Корови</li>
                        <li>Осли</li>
                    </ul>
                </li>
                <li><span>Птахи</span>
                    <ul>
                        <li>Горобці</li>
                        <li>Сови</li>
                    </ul>
                </li>
            </ul>
        </li>
        <li><span>Рослини</span>
            <ul>
                <li>Дуб</li>
                <li>Троянда</li>
            </ul>
        </li>
    </ul>

    <script src="main.js"></script>
</body>
</html>
